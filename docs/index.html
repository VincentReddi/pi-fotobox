<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Fotobox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pi Fotobox</h1>
    <span id="live" class="live" hidden>● live</span>
  </header>

  <main>
    <section id="stage" class="stage">
      <div id="countdown" class="countdown" hidden></div>
      <p id="message" class="message">Verbinde …</p>
      <div id="progress" class="progress" hidden><div id="bar"></div></div>
    </section>

    <h2 id="session-title" hidden></h2>
    <section id="gallery" class="gallery"></section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lb-prev" class="lb-nav" aria-label="Vorheriges Foto">‹</button>
    <img id="lb-img" alt="">
    <button id="lb-next" class="lb-nav" aria-label="Nächstes Foto">›</button>
    <button id="lb-close" class="lb-close" aria-label="Schließen">✕</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
